# OntaDev_Xray

lamp:
  # Радиус сферы подсветки в блоках, по умолчанию для новых ламп (/xray give).
  default-radius: 10
  # Сколько блоков одновременно можно подсветить (жёсткий лимит на число клиентских сущностей).
  default-max-highlighted-blocks: 100
  # Перезарядка лампы в секундах.
  default-cooldown: 1
  # Видят ли подсветку все игроки рядом (true) или только тот, кто использовал лампу (false).
  default-highlight-for-all: true
  # Материалы, которые подсвечивает новая лампа - должны присутствовать в глобальном списке.
  default-materials:
    - DIAMOND_ORE
    - GOLD_ORE
    - EMERALD_ORE
  # Как часто включённая лампа обновляет подсветку и списывает заряд (20 тиков = 1 секунда).
  refresh-interval-ticks: 20

fuel:
  # Каким предметом заряжается лампа (см. /xray givefuel).
  fuel-item-material: GLOWSTONE_DUST
  # Сколько заряда добавляет один предмет топлива.
  fuel-per-item: 10
  # Максимальный запас заряда лампы.
  max-fuel: 100
  # Сколько заряда стоит само включение лампы.
  fuel-cost-per-use: 1
  # Сколько заряда в секунду тратит включённая лампа (можно дробное, например 0.5).
  fuel-drain-per-second: 2.0

item:
  # Каким предметом является сама лампа.
  lamp-material: LANTERN

# База данных настраивается не здесь, а в plugins/OntaDev_Libs/settings.yml (общая для плагинов на OntaDev_Libs).
